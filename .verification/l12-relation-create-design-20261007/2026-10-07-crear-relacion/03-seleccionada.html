			/**
 * Estilos de las pantallas de superusuario (`/editores`, `/copias`) y de sus diálogos.
 *
 * Hoja GLOBAL con todo bajo `.vega-admin-*`, importada solo por esas dos rutas y por sus diálogos:
 * las dos pantallas comparten el mismo esqueleto (cabecera, tarjeta de lista, tabla que se apila en
 * móvil, estados, puerta de superusuario, diálogo con campos) y copiar ese CSS en cada componente,
 * como hacen `/papelera` y `/c/[type]`, duplicaría unas 300 líneas que tienen que cambiar juntas.
 * Global porque el contenido de los diálogos lo pinta la página que los usa: un `<style>` con
 * ámbito no llegaría a ese marcado. El prefijo evita choques con el resto de la app, y al
 * importarse desde las rutas va en su chunk diferido, no en la carga inicial.
 *
 * Medidas y tokens: calco de las piezas existentes que cita la lámina del audit (piezas 5 y 6):
 * cabecera de `/papelera`, `.vega-list-card` + tabla de `RecordTable`, `.vega-status-badge`,
 * diálogo de `DeleteConfirm`, `.vega-manifest-gate` de `/settings` y `.notice` de `/papelera`.
 * Sin tokens nuevos y sin ningún color literal (el velo del diálogo está en `AdminDialog.svelte`).
 */

			.vega-admin-page {
				display: flex;
				flex-direction: column;
				gap: var(--vega-space-gutter);
			}

			/* ————— Cabecera ————— */

			.vega-admin-head {
				display: flex;
				align-items: baseline;
				flex-wrap: wrap;
				gap: 0.6rem 1rem;
				margin-bottom: 0.4rem;
			}

			.vega-admin-head h1 {
				margin: 0;
				font-size: 1.45em;
				font-weight: 700;
				color: var(--ink-hi);
				letter-spacing: -0.01em;
			}

			.vega-admin-meta {
				color: var(--ink-2);
				font-size: 0.9em;
			}

			.vega-admin-meta b {
				font-family: var(--mono);
				font-weight: 500;
			}

			.vega-admin-head-spacer {
				flex: 1;
			}

			.vega-admin-desc {
				margin: 0;
				max-width: 46rem;
				color: var(--ink-2);
				font-size: 0.9rem;
			}

			/* ————— Botones ————— */

			.vega-admin-btn {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				height: 34px;
				padding: 0 0.9rem;
				border: 1px solid var(--line);
				border-radius: var(--r);
				background: var(--btn);
				color: var(--ink);
				font: inherit;
				font-size: 0.8125rem;
				font-weight: 550;
				line-height: 1.2;
				white-space: nowrap;
				cursor: pointer;
			}

			.vega-admin-btn:hover:not([aria-disabled='true']) {
				border-color: var(--line-strong);
			}

			.vega-admin-btn[aria-disabled='true'] {
				cursor: not-allowed;
				opacity: 0.5;
			}

			.vega-admin-btn--primary {
				border-color: transparent;
				background: var(--accent-fill);
				color: var(--accent-ink);
				font-weight: 600;
			}

			.vega-admin-btn--primary:hover:not([aria-disabled='true']) {
				border-color: transparent;
				box-shadow: 0 0 0 1.5px var(--accent-line);
			}

			.vega-admin-btn--primary[aria-disabled='true'] {
				opacity: 0.45;
			}

			.vega-admin-btn--danger {
				border-color: transparent;
				background: var(--danger-soft);
				color: var(--danger);
			}

			.vega-admin-btn--danger:hover:not([aria-disabled='true']) {
				border-color: transparent;
				box-shadow: 0 0 0 1.5px var(--danger);
			}

			.vega-admin-btn--sm {
				height: 30px;
				padding: 0 0.75rem;
				font-size: 0.8rem;
			}

			.vega-admin-icon-btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 1.8rem;
				height: 1.8rem;
				flex-shrink: 0;
				border: 0;
				border-radius: 6px;
				background: transparent;
				color: var(--ink-2);
				cursor: pointer;
			}

			.vega-admin-icon-btn:hover {
				background: var(--active);
				color: var(--ink);
			}

			/* Objetivo táctil de 44 px con puntero basto (misma regla que el resto de la app). */
			@media (pointer: coarse) {
				.vega-admin-btn {
					min-height: 44px;
				}

				.vega-admin-icon-btn {
					min-width: 44px;
					min-height: 44px;
				}
			}

			/* ————— Tarjeta de lista, estados y tabla ————— */

			.vega-admin-card {
				border: 1px solid var(--line);
				border-radius: var(--r);
				background: var(--paper);
				box-shadow: var(--shadow-card);
				overflow: hidden;
			}

			.vega-admin-state {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 0.6rem;
				padding: 1.25rem var(--cell-x);
				color: var(--ink-2);
			}

			.vega-admin-state p {
				margin: 0;
			}

			.vega-admin-state-title {
				color: var(--ink-hi);
				font-weight: 600;
			}

			/* «⟳ …» de lo que está en curso: mismo glifo que `.vega-editor-saved-at--saving`. */
			.vega-admin-saving {
				font-family: var(--mono);
				font-size: 0.85rem;
				white-space: nowrap;
			}

			.vega-admin-saving::before {
				content: '⟳ ';
				color: var(--info);
			}

			.vega-admin-table {
				width: 100%;
				border-collapse: collapse;
				font-size: 0.9rem;
			}

			.vega-admin-table thead th {
				padding: 0.5rem var(--cell-x);
				text-align: left;
				white-space: nowrap;
				font-size: 0.6875rem;
				font-weight: 650;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--ink-2);
				background: var(--paper);
				border-bottom: 1px solid var(--line-strong);
			}

			.vega-admin-table thead th.vega-admin-right,
			.vega-admin-table td.vega-admin-right {
				text-align: right;
			}

			.vega-admin-table tbody tr {
				height: var(--row-h);
				border-bottom: 1px solid var(--line);
			}

			.vega-admin-table tbody tr:last-child {
				border-bottom: 0;
			}

			.vega-admin-table tbody tr:hover {
				background: var(--accent-soft);
			}

			.vega-admin-table td {
				max-width: 24rem;
				padding: 0.4rem var(--cell-x);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				vertical-align: middle;
			}

			.vega-admin-table td.vega-admin-main {
				width: 50%;
				max-width: 0;
			}

			.vega-admin-table td.vega-admin-actions {
				width: 1%;
				max-width: none;
				overflow: visible;
			}

			.vega-admin-mono {
				font-family: var(--mono);
				font-size: 0.75rem;
				color: var(--ink-2);
				font-variant-numeric: tabular-nums;
			}

			.vega-admin-title {
				display: block;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--ink-hi);
				font-weight: 500;
			}

			.vega-admin-title--mono {
				font-family: var(--mono);
				font-size: 0.85rem;
			}

			.vega-admin-row-actions {
				display: flex;
				justify-content: flex-end;
				gap: 0.4rem;
			}

			/* Fecha con rótulo dentro de la fila apilada («Alta 3 feb 2026»): solo en móvil; la de la tabla,
   solo en escritorio (ver el `@media` de abajo). */
			.vega-admin-stack-only {
				display: none;
			}

			.vega-admin-who {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				min-width: 0;
			}

			.vega-admin-avatar {
				display: inline-grid;
				place-items: center;
				flex-shrink: 0;
				width: 24px;
				height: 24px;
				border-radius: 50%;
				background: var(--accent-soft);
				color: var(--accent-text);
				font-size: 0.68rem;
				font-weight: 700;
			}

			.vega-admin-you {
				flex-shrink: 0;
				color: var(--ink-2);
				font-size: 0.72rem;
			}

			/* Etiqueta de estado: la de `.vega-status-badge` (punto + fondo suave, nunca solo color: el
   texto dice el estado). */
			.vega-admin-tag {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				flex-shrink: 0;
				height: 24px;
				padding: 0 0.65rem;
				border-radius: 999px;
				font-size: 0.72rem;
				font-weight: 600;
				white-space: nowrap;
			}

			.vega-admin-tag::before {
				content: '';
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: currentColor;
				flex-shrink: 0;
			}

			.vega-admin-tag[data-kind='pub'] {
				color: var(--success);
				background: var(--success-soft);
			}

			.vega-admin-tag[data-kind='other'] {
				color: var(--info);
				background: var(--info-soft);
			}

			/* Fila provisional de la copia en curso (tokens `--info`/`--info-soft`, contraste medido en la
   lámina: 6,19 en claro y 5,72 en oscuro). */
			.vega-admin-table tbody tr.vega-admin-running,
			.vega-admin-table tbody tr.vega-admin-running:hover {
				background: var(--info-soft);
			}

			.vega-admin-running .vega-admin-saving {
				color: var(--info);
			}

			.vega-admin-sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}

			/* Por debajo del punto estructural de la app (768 px) la tabla se apila por filas: fila 1 =
   principal + etiqueta, fila 2 = meta, fila 3 = acciones. */
			@media (max-width: 768px) {
				.vega-admin-table thead {
					position: absolute;
					width: 1px;
					height: 1px;
					overflow: hidden;
					clip: rect(0, 0, 0, 0);
				}

				.vega-admin-table,
				.vega-admin-table tbody,
				.vega-admin-table tr,
				.vega-admin-table td {
					display: block;
					width: 100%;
					box-sizing: border-box;
				}

				.vega-admin-table tbody tr {
					display: grid;
					grid-template-columns: minmax(0, 1fr) auto;
					gap: 0.25rem 0.6rem;
					height: auto;
					padding: 0.7rem var(--cell-x);
				}

				.vega-admin-table td,
				.vega-admin-table td.vega-admin-main,
				.vega-admin-table td.vega-admin-actions {
					width: auto;
					max-width: none;
					padding: 0;
				}

				.vega-admin-table td.vega-admin-main {
					grid-column: 1 / 2;
				}

				.vega-admin-table td.vega-admin-side {
					grid-column: 2;
					grid-row: 1;
					justify-self: end;
				}

				.vega-admin-table td.vega-admin-meta-cell {
					grid-column: 1 / -1;
					text-align: left;
				}

				.vega-admin-table td.vega-admin-actions {
					grid-column: 1 / -1;
				}

				.vega-admin-table td.vega-admin-actions .vega-admin-row-actions {
					justify-content: flex-start;
					flex-wrap: wrap;
				}

				.vega-admin-stack-only {
					display: inline;
				}

				.vega-admin-table-only {
					display: none;
				}

				.vega-admin-head .vega-admin-btn--primary {
					order: 5;
				}
			}

			/* ————— Puerta de superusuario (`.vega-manifest-gate` de /settings) ————— */

			.vega-admin-gate {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				max-width: 34rem;
				padding: 1rem 1.2rem;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--surface-2);
			}

			.vega-admin-gate h1 {
				margin: 0;
				font-size: 1.1rem;
				color: var(--ink-hi);
			}

			.vega-admin-gate p {
				margin: 0;
				color: var(--ink-2);
				font-size: 0.9rem;
			}

			/* ————— Avisos (`.notice` de /papelera) ————— */

			.vega-admin-notice {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				padding: 0.75rem 1rem;
				border: 1px solid;
				border-radius: var(--r);
			}

			.vega-admin-notice p {
				margin: 0;
			}

			.vega-admin-notice-title {
				font-weight: 600;
				color: var(--ink-hi);
			}

			.vega-admin-notice-body {
				color: var(--ink);
				font-size: 0.88rem;
			}

			.vega-admin-notice-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin-top: 0.15rem;
			}

			.vega-admin-notice--info {
				border-color: var(--info);
				background: var(--info-soft);
				color: var(--info);
			}

			.vega-admin-notice--warning {
				border-color: var(--warning);
				background: var(--warning-soft);
				color: var(--warning);
			}

			.vega-admin-notice--danger {
				border-color: var(--danger);
				background: var(--danger-soft);
				color: var(--danger);
			}

			/* ————— Diálogo (`DeleteConfirm`/`MediaDetail`). El velo vive en `AdminDialog.svelte`, donde
   `check-theme-coverage.mjs` lo puede ver: esa comprobación solo lee `.svelte` y `.ts`. ————— */

			.vega-admin-dialog {
				display: flex;
				flex-direction: column;
				gap: 0.9rem;
				width: 100%;
				max-width: 26rem;
				max-height: calc(100vh - 2 * var(--vega-space-gutter));
				overflow-y: auto;
				box-sizing: border-box;
				padding: 1.5rem;
				border-radius: 10px;
				background: var(--surface);
				color: var(--ink);
				box-shadow: var(--shadow-card);
			}

			.vega-admin-dialog-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 0.5rem;
			}

			.vega-admin-dialog-head h2 {
				margin: 0;
				font-size: 1.1rem;
				color: var(--ink-hi);
			}

			.vega-admin-dialog > p,
			.vega-admin-dialog-text {
				margin: 0;
				color: var(--ink-2);
				font-size: 0.9rem;
			}

			.vega-admin-dialog-text b {
				color: var(--ink);
				overflow-wrap: anywhere;
			}

			.vega-admin-dialog-actions {
				display: flex;
				justify-content: flex-end;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin-top: 0.25rem;
			}

			/* ————— Campos ————— */

			.vega-admin-form {
				display: flex;
				flex-direction: column;
				gap: 0.9rem;
				margin: 0;
			}

			.vega-admin-field {
				display: flex;
				flex-direction: column;
				min-width: 0;
			}

			.vega-admin-field > label {
				display: block;
				margin-bottom: 0.35rem;
				font-size: 0.82em;
				font-weight: 650;
				letter-spacing: 0.03em;
				color: var(--ink-2);
			}

			.vega-admin-input {
				width: 100%;
				box-sizing: border-box;
				padding: calc(var(--pad-field) * 0.55) calc(var(--pad-field) * 0.7);
				border: 1px solid var(--line);
				border-radius: var(--r);
				background: var(--surface);
				color: var(--ink);
				font: inherit;
			}

			.vega-admin-input:hover {
				border-color: var(--line-strong);
			}

			.vega-admin-input[aria-invalid='true'] {
				border-color: var(--danger);
			}

			/* Ayuda en `--ink-2`, no en `--ink-3`: medido en la lámina, `--ink-3` da 2,2:1 en claro. */
			.vega-admin-help {
				margin: 0.3rem 0 0;
				font-size: 0.82em;
				color: var(--ink-2);
			}

			.vega-admin-field-error {
				margin: 0.35rem 0 0;
				font-size: 0.84em;
				font-weight: 600;
				color: var(--danger);
			}

			.vega-admin-choices {
				display: flex;
				flex-direction: column;
				gap: 0.45rem;
				margin: 0;
				padding: 0;
				border: 0;
			}

			.vega-admin-radio-card {
				display: flex;
				align-items: flex-start;
				gap: 0.6rem;
				padding: 0.6rem 0.75rem;
				border: 1px solid var(--line);
				border-radius: var(--r);
				background: var(--surface-2);
				font-size: 0.88rem;
				cursor: pointer;
			}

			.vega-admin-radio-card[data-checked='true'] {
				border-color: var(--accent-line);
				background: var(--accent-soft);
			}

			.vega-admin-radio-card input {
				margin-top: 0.2rem;
				accent-color: var(--accent);
			}

			.vega-admin-radio-card b {
				display: block;
				color: var(--ink-hi);
				font-weight: 600;
			}

			.vega-admin-radio-card span span {
				color: var(--ink-2);
				font-size: 0.82rem;
			}

			/* ————— Ajustes del servidor dentro de una pantalla (tarjetas de /copias y, después, de /editores).
   Composiciones de la lámina `design/mockups/2026-10-01-ajustes-y-sembrado` (sección 2.1): ningún
   token nuevo, cada medida es la de una pieza que ya existe. ————— */

			/* Cabecera de sección dentro de una pantalla de administración (h2 bajo el h1 de la página).
   Mismo reparto que `.vega-admin-head`; tamaño de `.vega-admin-dialog-head h2`. */
			.vega-admin-subhead {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				width: 100%;
			}

			/* Sin `flex-wrap`: en estrecho parte línea el TÍTULO y «Cambiar» se queda arriba a la derecha.
   Con `wrap`, el botón caía solo a una segunda línea, a la izquierda. */
			.vega-admin-subhead > .vega-admin-tag,
			.vega-admin-subhead > .vega-admin-btn {
				flex-shrink: 0;
			}

			/* Por debajo del punto estructural (768 px): título y «Cambiar» en la primera línea, la etiqueta
   debajo. Sin esto el título se partía en tres líneas para hacer sitio a la etiqueta. */
			@media (max-width: 768px) {
				.vega-admin-subhead {
					display: grid;
					grid-template-columns: minmax(0, 1fr) auto;
					gap: 0.4rem 0.75rem;
				}

				.vega-admin-subhead > .vega-admin-head-spacer {
					display: none;
				}

				.vega-admin-subhead > .vega-admin-btn {
					grid-column: 2;
					grid-row: 1;
				}

				.vega-admin-subhead > .vega-admin-tag {
					grid-column: 1 / -1;
					justify-self: start;
				}
			}

			.vega-admin-subhead h2 {
				min-width: 0;
				margin: 0;
				font-size: 1.1rem;
				color: var(--ink-hi);
			}

			/* Formulario dentro de una tarjeta (`.vega-admin-state` alinea a la izquierda): ocupa el ancho y
   se queda en la medida de `.vega-admin-gate` (34rem) para que las líneas no se estiren a 1440. */
			.vega-admin-form--inset {
				width: 100%;
				max-width: 34rem;
			}

			/* Dos campos en una línea (servidor + puerto). Se apilan solos cuando no caben. */
			.vega-admin-form-row {
				display: flex;
				flex-wrap: wrap;
				gap: 0.9rem; /* el `gap` de `.vega-admin-form` */
			}

			.vega-admin-form-row > .vega-admin-field {
				flex: 1 1 12rem;
			}

			/* Campo corto: 8rem, el ancho de los numéricos de `RevisionsSettings`. */
			.vega-admin-form-row > .vega-admin-field--short {
				flex: 0 1 8rem;
			}

			.vega-admin-input--short {
				width: 8rem;
				max-width: 100%;
			}

			.vega-admin-input--mono {
				font-family: var(--mono);
				font-size: 0.92em; /* el del campo ruta/slug (`.vega-field-row--path`) */
			}

			.vega-admin-input:focus-visible {
				outline: 2px solid var(--ring);
				outline-offset: 1px;
				border-color: var(--line-strong);
			}

			/* Grupo de campos dentro de un formulario de administración: `fieldset` sin caja. */
			.vega-admin-group {
				display: flex;
				flex-direction: column;
				gap: 0.9rem;
				min-width: 0;
				margin: 0;
				padding: 0;
				border: 0;
			}

			.vega-admin-group > legend {
				margin-bottom: 0.6rem;
				padding: 0;
				font-size: 0.6875rem;
				font-weight: 650;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--ink-2);
			}

			/* Casilla con rótulo. Casilla y no interruptor: aquí nada se aplica hasta «Guardar». */
			.vega-admin-check {
				display: flex;
				align-items: flex-start;
				gap: 0.6rem;
				font-size: 0.88rem;
				color: var(--ink);
				cursor: pointer;
			}

			.vega-admin-check input {
				margin-top: 0.2rem;
				accent-color: var(--accent);
			}

			.vega-admin-check span span {
				display: block;
				color: var(--ink-2);
				font-size: 0.82rem;
			}

			.vega-admin-form-actions {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.5rem;
			}

			/* Bloque «probar» dentro de la tarjeta: separado del formulario por la misma raya de las filas. */
			.vega-admin-test {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
				width: 100%;
				max-width: 34rem;
				padding-top: 0.9rem;
				border-top: 1px solid var(--line);
			}

			.vega-admin-test-row {
				display: flex;
				flex-wrap: wrap;
				align-items: flex-end;
				gap: 0.5rem;
			}

			.vega-admin-test-row .vega-admin-field {
				flex: 1 1 12rem;
			}

			/* Resultado correcto de una prueba: la etiqueta de estado existente + una frase. */
			.vega-admin-result {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.4rem 0.6rem;
				margin: 0;
				font-size: 0.88rem;
				color: var(--ink);
			}

			/* Salida literal del servidor: calco de `.vega-revisions-settings-json`, que ya ajusta líneas. */
			.vega-admin-output {
				max-height: 16rem;
				margin: 0;
				padding: 0.5rem;
				overflow: auto;
				border: 1px solid var(--line);
				border-radius: var(--r);
				background: var(--surface);
				color: var(--ink);
				font-family: var(--mono);
				font-size: 0.75rem;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}

			/* Resumen de un ajuste guardado: pares rótulo/valor, como `.vega-editor-kv` pero a la izquierda. */
			.vega-admin-summary {
				display: flex;
				flex-direction: column;
				gap: 0.2rem;
				width: 100%;
				margin: 0;
				font-size: 0.88rem;
			}

			.vega-admin-summary > div {
				display: flex;
				flex-wrap: wrap;
				gap: 0.15rem 0.6rem;
			}

			.vega-admin-summary dt {
				flex: 0 0 10rem;
				color: var(--ink-2);
			}

			.vega-admin-summary dd {
				flex: 1 1 12rem;
				min-width: 0;
				margin: 0;
				color: var(--ink);
				overflow-wrap: anywhere;
			}

			.vega-admin-notice-body {
				overflow-wrap: anywhere;
			}

			.vega-admin-notice code,
			.vega-admin-dialog-text code,
			.vega-admin-summary code {
				font-family: var(--mono);
				font-size: 0.92em;
				overflow-wrap: anywhere;
			}

			/* El enlace de `.vega-conflict-link`, para «Detalle técnico» y «Quitar la contraseña guardada». */
			.vega-admin-link {
				align-self: flex-start;
				padding: 0;
				border: 0;
				background: none;
				color: var(--accent-text);
				font: inherit;
				font-size: 0.82rem;
				cursor: pointer;
			}

			.vega-admin-link:hover {
				text-decoration: underline;
			}

			details > summary.vega-admin-link {
				list-style-position: inside;
			}

			details[open] > summary.vega-admin-link {
				margin-bottom: 0.4rem;
			}

			@media (pointer: coarse) {
				/* Medido a 390: el `select` se quedaba en 41 px y los campos en mono en 43 px. */
				.vega-admin-input {
					min-height: 44px;
				}

				.vega-admin-check,
				.vega-admin-link {
					min-height: 44px;
					align-items: center;
				}

				.vega-admin-link {
					display: inline-flex;
				}

				.vega-admin-check input {
					margin-top: 0;
				}
			}

			/* Composition only. Tokens, dialog, buttons and fields come from existing Vega CSS. */
			* {
				box-sizing: border-box;
			}
			html {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				font:
					14px/1.5 system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				background: var(--bg);
				color: var(--ink);
			}
			[hidden] {
				display: none !important;
			}
			button,
			input,
			textarea,
			select {
				font: inherit;
			}
			button {
				cursor: pointer;
			}
			:focus-visible {
				outline: 2px solid var(--accent-text);
				outline-offset: 2px;
			}
			.lab {
				padding: 0.75rem 1rem;
				background: var(--surface);
				border-bottom: 1px solid var(--line);
				display: flex;
				gap: 0.75rem;
				flex-wrap: wrap;
				align-items: center;
				color: var(--ink-2);
			}
			.lab select {
				color: var(--ink);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--r);
				min-height: 44px;
				max-width: 100%;
			}
			.lab small {
				flex: 1 1 100%;
			}
			.topbar {
				height: 54px;
				display: flex;
				align-items: center;
				gap: 1rem;
				padding: 0 1rem;
				background: var(--paper);
				border-bottom: 1px solid var(--line);
			}
			.layout {
				display: grid;
				grid-template-columns: 236px minmax(0, 1fr);
				min-height: 690px;
			}
			.sidebar {
				background: var(--sidebar);
				border-right: 1px solid var(--line);
				padding: 1rem;
			}
			.sidebar p {
				padding: 0.65rem 1rem;
				margin: 0;
				color: var(--ink);
			}
			.sidebar .active {
				background: var(--active);
				border-radius: var(--r);
			}
			.workspace {
				min-width: 0;
				padding: 1.5rem;
			}
			.editbar {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 0.75rem;
				margin-bottom: 1.5rem;
			}
			.editbar h1 {
				margin: 0;
				font-size: 1.3rem;
				color: var(--ink-hi);
			}
			.editbar .save-parent {
				margin-left: auto;
			}
			.dirty {
				color: var(--ink);
				font-size: 0.85rem;
			}
			.field-card {
				padding: var(--pad-card);
				background: var(--paper);
				border: 1px solid var(--line);
				border-radius: var(--r);
				max-width: 60rem;
			}
			.field {
				margin-bottom: 1.75rem;
			}
			.field:last-child {
				margin: 0;
			}
			.field label {
				display: block;
				color: var(--ink-2);
				font-size: 0.85rem;
				font-weight: 600;
				margin-bottom: 0.5rem;
			}
			.title-input {
				width: 100%;
				resize: vertical;
				min-height: 3rem;
				background: transparent;
				border: 0;
				border-bottom: 1px solid var(--line);
				color: var(--ink-hi);
				font-size: 1.3rem;
				font-weight: 650;
			}
			.relation {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			.selected {
				display: flex;
				flex-wrap: wrap;
				gap: 0.4rem;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 0.35rem;
				padding: 0.25rem 0.6rem;
				border: 1px solid var(--accent);
				border-radius: 999px;
				background: var(--accent);
				color: var(--accent-ink);
				font-size: 0.85rem;
				max-width: 100%;
				min-width: 0;
			}
			.chip span {
				overflow-wrap: anywhere;
				min-width: 0;
			}
			.chip button {
				min-height: 44px;
				background: transparent;
				color: inherit;
				border: 0;
				text-decoration: underline;
			}
			.status,
			.help {
				color: var(--ink-2);
				font-size: 0.85rem;
				margin: 0.3rem 0;
			}
			.create-row {
				display: flex;
				align-items: center;
				gap: 0.5rem;
			}
			.create-row button {
				white-space: normal;
				height: auto;
				min-height: 44px;
				text-align: left;
				overflow-wrap: anywhere;
			}
			.success {
				color: var(--success);
				background: var(--success-soft);
				padding: 0.75rem;
				border-radius: var(--r);
				margin-top: 1rem;
			}
			.backdrop {
				position: fixed;
				z-index: 70;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				background: rgb(15 17 21 / 55%);
			}
			.vega-admin-dialog {
				max-height: calc(100dvh - 2rem);
			}
			.vega-admin-dialog-head h2 {
				overflow-wrap: anywhere;
			}
			.vega-admin-dialog-actions button {
				white-space: normal;
				height: auto;
				min-height: 44px;
				justify-content: center;
			}
			.vega-admin-icon-btn {
				min-width: 44px;
				min-height: 44px;
			}
			.vega-admin-input {
				min-height: 44px;
			}
			.modal-note {
				padding: 0.75rem;
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r);
				color: var(--ink-2);
				font-size: 0.85rem;
			}
			.form-message {
				color: var(--danger);
				font-size: 0.85rem;
			}
			.duplicate {
				background: var(--warning-soft);
				color: var(--warning);
				padding: 0.75rem;
				border-radius: var(--r);
			}
			.duplicate button {
				margin-top: 0.5rem;
			}
			@media (max-width: 768px) {
				.layout {
					display: block;
				}
				.sidebar {
					display: none;
				}
				.workspace {
					padding: 1rem;
				}
				.field-card {
					padding: 1.1rem;
				}
				.editbar .save-parent {
					margin-left: 0;
					min-height: 44px;
				}
				.vega-admin-dialog {
					padding: 1.5rem;
				}
				.vega-admin-dialog-actions {
					display: grid;
					grid-template-columns: 1fr;
				}
				.vega-admin-dialog-actions .primary {
					order: -1;
				}
				.lab label {
					display: grid;
					width: 100%;
					gap: 0.25rem;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
				}
			}
		</style>
	</head>
	<body>
		<div class="lab">
			<strong>Vega · L12 · mockup</strong
			><label
				>Idioma / Language
				<select id="language">
					<option value="es">Español</option>
					<option value="en">English</option>
				</select></label
			><label
				>Tema
				<select id="theme">
					<option>niebla</option>
					<option>miel</option>
					<option>aquelarre</option>
				</select></label
			><label
				>Modo
				<select id="mode">
					<option value="system">Sistema</option>
					<option value="light">Claro</option>
					<option value="dark">Oscuro</option>
				</select></label
			><label
				>Estado
				<select id="scenario">
					<option value="normal">Flujo normal</option>
					<option value="empty">Vacío</option>
					<option value="long">Texto largo</option>
					<option value="loading">Guardando</option>
					<option value="validation">Campo obligatorio</option>
					<option value="duplicate">Dirección duplicada</option>
					<option value="network">Resultado incierto</option>
					<option value="readonly">Campo solo lectura</option>
					<option value="denied">Sin permiso de crear</option>
					<option value="hidden">Creación oculta</option>
					<option value="limit">Límite de selección</option>
				</select></label
			><small data-copy="mockup"></small>
		</div>
		<div id="parent-screen">
			<header class="topbar"><strong>Vega</strong><span>fodaveg.net</span></header>
			<div class="layout">
				<aside class="sidebar">
					<p>Entradas</p>
					<p>Etiquetas</p>
					<p>Medios</p>
					<p>Ajustes</p>
				</aside>
				<main class="workspace">
					<header class="editbar">
						<h1>Entradas</h1>
						<span class="dirty" data-copy="dirty"></span
						><button
							type="button"
							class="vega-admin-btn save-parent"
							data-copy="saveParent"
						></button>
					</header>
					<div class="field-card">
						<div class="field">
							<label for="parent-title" data-copy="title"></label
							><textarea id="parent-title" class="title-input">
Migrar el blog de Hugo a Astro sin romper las URLs</textarea>
						</div>
						<div class="field">
							<label for="search">Etiquetas</label>
							<div class="relation">
								<div id="selected" class="selected"></div>
								<input id="search" class="vega-admin-input" value="Taller" />
								<p id="search-status" class="status" aria-live="polite"></p>
								<div class="create-row">
									<button id="open-create" type="button" class="vega-admin-btn"></button>
								</div>
								<p id="relation-help" class="help"></p>
							</div>
						</div>
						<div id="success" class="success" role="status" hidden></div>
					</div>
				</main>
			</div>
		</div>
		<div class="backdrop" id="modal" hidden>
			<section
				class="vega-admin-dialog"
				role="dialog"
				aria-modal="true"
				aria-labelledby="modal-title"
				aria-describedby="modal-note"
			>
				<header class="vega-admin-dialog-head">
					<h2 id="modal-title"></h2>
					<button class="vega-admin-icon-btn" id="close" aria-label="Cerrar">×</button>
				</header>
				<p class="vega-admin-dialog-text" data-copy="returnTo"></p>
				<form id="child-form" class="vega-admin-form" novalidate>
					<div id="child-fields">
						<div class="vega-admin-field">
							<label for="name" data-copy="name"></label
							><input id="name" class="vega-admin-input" maxlength="80" required />
							<p id="name-error" class="vega-admin-field-error" hidden></p>
						</div>
						<div class="vega-admin-field">
							<label for="slug">Dirección (slug) *</label
							><input id="slug" class="vega-admin-input" maxlength="80" required />
							<p class="vega-admin-help" data-copy="slugHelp"></p>
							<p id="slug-error" class="vega-admin-field-error" hidden></p>
						</div>
					</div>
					<div id="duplicate" class="duplicate" hidden>
						<p data-copy="duplicate"></p>
						<button
							id="use-existing"
							class="vega-admin-btn"
							type="button"
							data-copy="useExisting"
						></button>
					</div>
					<p id="form-error" class="form-message" role="alert" hidden></p>
					<p class="modal-note" id="modal-note" data-copy="independent"></p>
					<div id="discard" hidden><p data-copy="discardBody"></p></div>
					<div class="vega-admin-dialog-actions">
						<button id="cancel" class="vega-admin-btn" type="button" data-copy="cancel"></button
						><button
							id="submit"
							class="vega-admin-btn vega-admin-btn--primary primary"
							type="submit"
							data-copy="create"
						></button>
					</div>
				</form>
			</section>
		</div>
		<script>
			// Local interaction sketch only. No requests, persistence, or product code.
			const copy = {
				es: {
					mockup:
						'Propuesta sin aprobar · montaje con esquema y valores de fixtures reales · simulación local, no guarda en Vega.',
					dirty: '● sin guardar',
					saveParent: 'Guardar',
					title: 'Título',
					search: 'Buscar por título…',
					empty: '— sin selección —',
					noResults: 'Sin resultados',
					typeSearch: 'Escribe para buscar…',
					createAction: 'Crear etiqueta «{name}»…',
					createBlank: 'Crear etiqueta…',
					help: 'Elige una etiqueta existente o crea una nueva.',
					readonly: 'Solo lectura',
					denied: 'Puedes elegir etiquetas existentes. No puedes crear etiquetas.',
					hidden: 'Puedes elegir etiquetas existentes.',
					limit: 'Quita una etiqueta para poder seleccionar otra.',
					dialog: 'Crear etiqueta',
					returnTo: 'Vuelves a esta entrada al terminar.',
					name: 'Nombre *',
					slugHelp:
						'La parte de la dirección del sitio que identifica la etiqueta. Se puede regenerar a partir del nombre.',
					independent:
						'La etiqueta se guarda ahora. La entrada se guarda después, con «Guardar». Si descartas la entrada, la etiqueta seguirá existiendo.',
					create: 'Crear y seleccionar',
					cancel: 'Cancelar',
					close: 'Cerrar',
					saving: 'Creando…',
					required: 'Completa este campo.',
					duplicateError: 'Esta dirección ya está en uso.',
					duplicate:
						'Hay una etiqueta visible con esta dirección. Puedes seleccionarla o cambiar la dirección para crear otra.',
					useExisting: 'Usar «Taller» existente',
					network:
						'Se perdió la conexión. No sabemos si se creó la etiqueta. Conservamos lo que has escrito; busca primero si ya existe antes de volver a crearla.',
					check: 'Buscar si ya existe',
					success: 'Etiqueta «{name}» creada y seleccionada. La entrada sigue sin guardar.',
					selected: 'Seleccionada: {name}',
					remove: 'Quitar',
					discardTitle: '¿Descartar esta etiqueta?',
					discardBody:
						'Se perderán los cambios de esta etiqueta. Los cambios de la entrada se conservan.',
					keep: 'Seguir editando',
					discard: 'Descartar etiqueta',
					parentDemo: 'Mockup: el guardado de la entrada no está conectado.',
					existingSuccess: 'Etiqueta existente seleccionada. La entrada sigue sin guardar.'
				},
				en: {
					mockup:
						'Unapproved proposal · composition with real schema and fixture values · local simulation; does not save to Vega.',
					dirty: '● unsaved',
					saveParent: 'Save',
					title: 'Title',
					search: 'Search by title…',
					empty: '— no selection —',
					noResults: 'No results',
					typeSearch: 'Type to search…',
					createAction: 'Create tag “{name}”…',
					createBlank: 'Create tag…',
					help: 'Choose an existing tag or create a new one.',
					readonly: 'Read only',
					denied: 'You can choose existing tags. You cannot create tags.',
					hidden: 'You can choose existing tags.',
					limit: 'Remove a tag before selecting another.',
					dialog: 'Create tag',
					returnTo: 'Return to this entry when you finish.',
					name: 'Name *',
					slugHelp:
						'La parte de la dirección del sitio que identifica la etiqueta. Se puede regenerar a partir del nombre.',
					independent:
						'The tag is saved now. Save the entry afterwards using “Save”. If you discard the entry, the tag will still exist.',
					create: 'Create and select',
					cancel: 'Cancel',
					close: 'Close',
					saving: 'Creating…',
					required: 'Complete this field.',
					duplicateError: 'This address is already in use.',
					duplicate:
						'There is a visible tag with this address. Select it, or change the address to create another.',
					useExisting: 'Use existing “Taller”',
					network:
						'The connection was lost. We do not know whether the tag was created. Your input is preserved; check whether it already exists before trying again.',
					check: 'Check whether it exists',
					success: 'Tag “{name}” created and selected. The entry is still unsaved.',
					selected: 'Selected: {name}',
					remove: 'Remove',
					discardTitle: 'Discard this tag?',
					discardBody: 'Changes to this tag will be lost. Changes to the entry will be kept.',
					keep: 'Keep editing',
					discard: 'Discard tag',
					parentDemo: 'Mockup: saving the entry is not connected.',
					existingSuccess: 'Existing tag selected. The entry is still unsaved.'
				}
			};
			const byId = (id) => document.getElementById(id);
			const params = new URLSearchParams(location.search);
			const mq = matchMedia('(prefers-color-scheme:dark)');
			let lang = params.get('lang') || 'es',
				scenario = params.get('state') || 'normal',
				initialStage = 'selected';
			let selected = '',
				childBaseline = '',
				discarding = false,
				busy = false,
				returnFocus = null;
			const t = (key, name = '') => copy[lang][key].replace('{name}', name);
			const longText = 'Migrar el blog de Hugo a Astro sin romper las URLs';
			byId('language').value = lang;
			byId('scenario').value = scenario;
			byId('mode').value = params.get('mode') || 'system';
			byId('theme').value = params.get('theme') || 'niebla';
			function applyTheme() {
				document.documentElement.dataset.theme = byId('theme').value;
				document.documentElement.dataset.mode =
					byId('mode').value === 'system' ? (mq.matches ? 'dark' : 'light') : byId('mode').value;
			}
			function translate() {
				document.documentElement.lang = lang;
				document
					.querySelectorAll('[data-copy]')
					.forEach((el) => (el.textContent = t(el.dataset.copy)));
				byId('search').placeholder = t('search');
				byId('close').ariaLabel = t('close');
			}
			function renderSelected() {
				const box = byId('selected');
				box.replaceChildren();
				if (!selected) {
					box.textContent = t('empty');
					box.className = 'status';
					return;
				}
				box.className = 'selected';
				const chip = document.createElement('span');
				chip.className = 'chip';
				const label = document.createElement('span');
				label.textContent = selected;
				const remove = document.createElement('button');
				remove.type = 'button';
				remove.textContent = t('remove');
				remove.ariaLabel = t('remove') + ' ' + selected;
				remove.hidden = scenario === 'readonly';
				remove.onclick = () => {
					selected = '';
					renderSelected();
					byId('success').hidden = true;
				};
				chip.append(label, remove);
				box.append(chip);
			}
			function updateSearch() {
				const query = byId('search').value.trim();
				byId('search-status').textContent = t(query ? 'noResults' : 'typeSearch');
				byId('open-create').textContent = query ? t('createAction', query) : t('createBlank');
				byId('open-create').hidden = ['readonly', 'denied', 'hidden'].includes(scenario);
				byId('open-create').disabled = scenario === 'limit';
				byId('search').readOnly = scenario === 'readonly';
				byId('search').hidden = scenario === 'readonly';
				byId('search-status').hidden = scenario === 'readonly';
				byId('relation-help').textContent = t(
					['readonly', 'denied', 'hidden', 'limit'].includes(scenario) ? scenario : 'help'
				);
			}
			function resetMessages() {
				for (const id of ['name-error', 'slug-error', 'form-error', 'duplicate', 'discard'])
					byId(id).hidden = true;
				for (const id of ['name', 'slug']) {
					byId(id).removeAttribute('aria-invalid');
					byId(id).removeAttribute('aria-describedby');
				}
				byId('child-fields').hidden = false;
				byId('modal-note').hidden = false;
				discarding = false;
				busy = false;
				byId('name').readOnly = false;
				byId('slug').readOnly = false;
				for (const id of ['submit', 'cancel', 'close'])
					byId(id).setAttribute('aria-disabled', 'false');
				byId('submit').textContent = t('create');
				byId('cancel').textContent = t('cancel');
			}
			function showModal() {
				if (['readonly', 'denied', 'hidden', 'limit'].includes(scenario)) return;
				returnFocus = document.activeElement;
				resetMessages();
				byId('name').value = byId('search').value.trim();
				byId('slug').value = byId('name').value === 'Taller' ? 'taller' : '';
				childBaseline = byId('name').value + '|' + byId('slug').value;
				byId('modal-title').textContent = t('dialog');
				byId('modal').hidden = false;
				byId('parent-screen').inert = true;
				byId('name').focus();
				if (scenario === 'loading') {
					busy = true;
					byId('submit').textContent = t('saving');
					for (const id of ['submit', 'cancel', 'close'])
						byId(id).setAttribute('aria-disabled', 'true');
					byId('child-form').setAttribute('aria-busy', 'true');
					byId('name').readOnly = true;
					byId('slug').readOnly = true;
				} else byId('child-form').removeAttribute('aria-busy');
				if (scenario === 'validation') {
					byId('slug').value = '';
					fieldError('slug', t('required'));
				}
				if (scenario === 'duplicate') {
					fieldError('slug', t('duplicateError'));
					byId('duplicate').hidden = false;
				}
				if (scenario === 'network') {
					byId('form-error').textContent = t('network');
					byId('form-error').hidden = false;
					byId('submit').textContent = t('check');
				}
			}
			function closeModal() {
				byId('modal').hidden = true;
				byId('parent-screen').inert = false;
				discarding = false;
				(returnFocus?.isConnected ? returnFocus : byId('open-create')).focus();
			}
			function cancel() {
				if (busy) return;
				if (discarding) {
					resetMessages();
					byId('modal-title').textContent = t('dialog');
					byId('name').focus();
					return;
				}
				if (childBaseline !== byId('name').value + '|' + byId('slug').value) {
					discarding = true;
					byId('modal-title').textContent = t('discardTitle');
					byId('child-fields').hidden = true;
					byId('modal-note').hidden = true;
					byId('discard').hidden = false;
					byId('cancel').textContent = t('keep');
					byId('submit').textContent = t('discard');
					byId('cancel').focus();
				} else closeModal();
			}
			function fieldError(id, message) {
				byId(id).setAttribute('aria-invalid', 'true');
				byId(id).setAttribute('aria-describedby', id + '-error');
				byId(id + '-error').textContent = message;
				byId(id + '-error').hidden = false;
				byId(id).focus();
			}
			function selectCreated(existing = false) {
				selected = byId('name').value.trim() || 'Taller';
				byId('search').value = '';
				updateSearch();
				renderSelected();
				byId('success').textContent = existing ? t('existingSuccess') : t('success', selected);
				byId('success').hidden = false;
				closeModal();
				byId('selected').querySelector('button')?.focus();
			}
			byId('child-form').onsubmit = (e) => {
				e.preventDefault();
				if (busy) return;
				if (discarding) {
					closeModal();
					return;
				}
				if (scenario === 'network') {
					byId('duplicate').hidden = false;
					return;
				}
				if (!byId('name').value.trim()) {
					fieldError('name', t('required'));
					return;
				}
				if (!byId('slug').value.trim()) {
					fieldError('slug', t('required'));
					return;
				}
				if (scenario === 'duplicate' && byId('slug').value === 'taller') {
					fieldError('slug', t('duplicateError'));
					return;
				}
				selectCreated();
			};
			byId('open-create').onclick = showModal;
			byId('cancel').onclick = cancel;
			byId('close').onclick = cancel;
			byId('use-existing').onclick = () => selectCreated(true);
			byId('search').oninput = updateSearch;
			byId('search').onkeydown = (e) => {
				if (e.key === 'Enter') e.preventDefault();
			};
			byId('language').onchange = () => {
				lang = byId('language').value;
				translate();
				renderSelected();
				updateSearch();
				if (!byId('modal').hidden) showModal();
			};
			byId('theme').onchange = applyTheme;
			byId('mode').onchange = applyTheme;
			mq.addEventListener('change', applyTheme);
			byId('scenario').onchange = () => {
				scenario = byId('scenario').value;
				byId('modal').hidden = true;
				byId('parent-screen').inert = false;
				selected = scenario === 'readonly' ? 'Taller' : '';
				byId('search').value =
					scenario === 'empty' ? '' : scenario === 'long' ? longText : 'Taller';
				translate();
				renderSelected();
				updateSearch();
				if (
					['loading', 'validation', 'duplicate', 'network'].includes(scenario) ||
					initialStage === 'create'
				)
					showModal();
			};
			document.querySelector('.save-parent').onclick = () => {
				byId('success').hidden = false;
				byId('success').textContent = t('parentDemo');
			};
			document.addEventListener('keydown', (e) => {
				if (byId('modal').hidden) return;
				if (e.key === 'Escape') {
					e.preventDefault();
					cancel();
				}
				if (e.key === 'Tab') {
					const items = [...byId('modal').querySelectorAll('button,input')].filter(
						(x) => x.getClientRects().length && !x.disabled
					);
					const first = items[0],
						last = items.at(-1);
					if (e.shiftKey && document.activeElement === first) {
						e.preventDefault();
						last.focus();
					} else if (!e.shiftKey && document.activeElement === last) {
						e.preventDefault();
						first.focus();
					}
				}
			});
			applyTheme();
			translate();
			renderSelected();
			updateSearch();
			if (scenario !== 'normal') byId('scenario').onchange();
			else if (initialStage === 'create') showModal();
			else if (initialStage === 'selected') {
				selected = 'Taller';
				byId('search').value = '';
				updateSearch();
				renderSelected();
				byId('success').textContent = t('success', selected);
				byId('success').hidden = false;
			}

			addEventListener('message', (e) => {
				if (e.source !== parent || e.data?.type !== 'review-config') return;
				const c = e.data;
				lang = c.lang;
				byId('language').value = lang;
				byId('mode').value = c.mode;
				byId('theme').value = c.theme;
				byId('scenario').value = c.scenario;
				applyTheme();
				byId('scenario').onchange();
				if (initialStage === 'selected' && scenario === 'normal') {
					selected = 'Taller';
					byId('search').value = '';
					updateSearch();
					renderSelected();
					byId('success').textContent = t('success', selected);
					byId('success').hidden = false;
				}
			});
		</script>
	</body>
</html>
